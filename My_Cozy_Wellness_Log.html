<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Cozy Wellness Log ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Patrick+Hand&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Patrick Hand', 'Mali', 'cursive', 'sans-serif'],
                        whimsy: ['Playfair Display', 'Mali', 'serif'],
                    },
                    colors: {
                        cream: '#FCF9F2',
                        borderlace: '#E5DCF0',
                        plum: '#4A3B5C',
                        lilac: '#8E7CA6',
                        lavender: { light: '#F3ECFA', DEFAULT: '#C4A7E7', dark: '#8E6BBF' },
                        mint: { light: '#E8F7F2', DEFAULT: '#8CD1BE', dark: '#4E9E88' },
                        blush: { light: '#FDEEF4', DEFAULT: '#F2A7C3', dark: '#C96B8E' },
                        periwinkle: { light: '#EBF2FC', DEFAULT: '#99B8EB', dark: '#5C82C4' }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FCF9F2;
            color: #4A3B5C;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(235, 222, 250, 0.55) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(252, 224, 236, 0.55) 0%, transparent 45%),
                radial-gradient(#DFD3EC 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 24px 24px;
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }

        .kawaii-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1.5px solid #E5DCF0;
            border-radius: 1.35rem;
            box-shadow: 0 8px 24px -6px rgba(142, 124, 166, 0.14);
            overflow: hidden;
        }

        .kawaii-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 0.9rem;
            border-bottom: 1.5px solid #E5DCF0;
            font-size: 0.75rem;
        }

        .kawaii-dots {
            display: flex;
            gap: 0.3rem;
        }
        .kawaii-dots span {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 9999px;
            border: 1px solid rgba(74, 59, 92, 0.25);
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body class="min-h-screen py-6 px-4 sm:px-6">

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Single-Page Centered Container (Easy to scroll on iPhone/iPad) -->
    <div class="max-w-xl mx-auto space-y-6">

        <!-- Simple Cute Header -->
        <header class="flex items-center justify-between bg-white/85 backdrop-blur-xs px-5 py-3.5 rounded-3xl border border-borderlace shadow-xs">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🎀</span>
                <div>
                    <h1 class="font-whimsy italic font-bold text-xl text-plum leading-none">My Cozy Wellness</h1>
                    <p id="header-date" class="text-xs text-lilac mt-1">Today</p>
                </div>
            </div>
            <button onclick="openModal('settings-modal')" class="p-2.5 rounded-2xl bg-lavender-light/70 text-plum hover:bg-lavender-light transition" title="Settings & Goals">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </header>

        <!-- ========================================== -->
        <!-- 1. CALORIES & PROTEIN TRACKER              -->
        <!-- ========================================== -->
        <section class="kawaii-card">
            <div class="kawaii-bar bg-blush-light/85">
                <span class="font-semibold text-blush-dark">🍓 calories_and_protein.exe</span>
                <div class="kawaii-dots"><span></span><span></span><span></span></div>
            </div>

            <div class="p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-whimsy italic font-bold text-xl text-plum">Today's Nourishment</h2>
                    <button onclick="openModal('settings-modal')" class="text-xs text-lilac underline hover:text-plum">Edit Target</button>
                </div>

                <!-- Progress Bars -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3.5 rounded-2xl bg-blush-light/45 border border-blush/40">
                        <div class="flex justify-between text-xs font-semibold mb-1.5">
                            <span class="text-plum">Calories</span>
                            <span class="text-blush-dark"><span id="cal-cur">0</span> / <span id="cal-goal">1800</span></span>
                        </div>
                        <div class="w-full h-2.5 bg-white rounded-full overflow-hidden">
                            <div id="cal-bar" class="h-full bg-blush rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="p-3.5 rounded-2xl bg-mint-light/45 border border-mint/40">
                        <div class="flex justify-between text-xs font-semibold mb-1.5">
                            <span class="text-plum">Protein</span>
                            <span class="text-mint-dark"><span id="pro-cur">0</span> / <span id="pro-goal">110</span>g</span>
                        </div>
                        <div class="w-full h-2.5 bg-white rounded-full overflow-hidden">
                            <div id="pro-bar" class="h-full bg-mint rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Simple Food Input Form -->
                <form onsubmit="addFood(event)" class="bg-cream/80 p-3.5 rounded-2xl border border-borderlace space-y-2.5">
                    <div class="flex gap-2">
                        <input type="text" id="food-name" placeholder="กินอะไรไปบ้าง (เช่น ข้าวมันไก่ไม่หนัง 1 จาน)..." required
                            class="flex-1 px-3 py-2 rounded-xl bg-white border border-borderlace text-sm focus:outline-none focus:border-blush">
                        <button type="button" onclick="estimateAI()" id="ai-btn" class="px-3 py-2 rounded-xl bg-gradient-to-r from-lavender to-blush text-white text-xs font-semibold hover:opacity-90 transition shrink-0">
                            ✨ AI คิดให้
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <input type="number" id="food-cal" placeholder="แคลอรี่ (kcal)" required min="0"
                            class="w-1/3 px-3 py-2 rounded-xl bg-white border border-borderlace text-sm focus:outline-none">
                        <input type="number" id="food-pro" placeholder="โปรตีน (g)" required min="0"
                            class="w-1/3 px-3 py-2 rounded-xl bg-white border border-borderlace text-sm focus:outline-none">
                        <button type="submit" class="w-1/3 py-2 rounded-xl bg-blush text-white font-semibold text-sm hover:bg-blush-dark transition">
                            + เพิ่มเมนู
                        </button>
                    </div>
                </form>

                <!-- Today's Food List -->
                <div id="food-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 2. SIMPLE WEEKLY WORKOUT CHECKLIST         -->
        <!-- ========================================== -->
        <section class="kawaii-card">
            <div class="kawaii-bar bg-mint-light/85">
                <span class="font-semibold text-mint-dark">🩰 weekly_workout.chk</span>
                <div class="kawaii-dots"><span></span><span></span><span></span></div>
            </div>

            <div class="p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="font-whimsy italic font-bold text-xl text-plum">Weekly Workout</h2>
                        <p class="text-xs text-lilac">ทำอันไหนเสร็จแล้วกดติ๊กถูกได้เลย (<span id="workout-progress">0/0</span>)</p>
                    </div>
                    <button onclick="resetWorkouts()" class="text-xs px-3 py-1.5 rounded-xl bg-cream border border-borderlace text-lilac hover:text-plum transition">
                        🔄 รีเซ็ตวีคใหม่
                    </button>
                </div>

                <!-- Add Workout Routine -->
                <form onsubmit="addWorkout(event)" class="flex gap-2">
                    <select id="wo-day" class="px-2.5 py-2 rounded-xl bg-cream border border-borderlace text-xs sm:text-sm font-medium text-plum focus:outline-none">
                        <option value="Mon">Mon</option>
                        <option value="Tue">Tue</option>
                        <option value="Wed">Wed</option>
                        <option value="Thu">Thu</option>
                        <option value="Fri">Fri</option>
                        <option value="Sat">Sat</option>
                        <option value="Sun">Sun</option>
                    </select>
                    <input type="text" id="wo-title" placeholder="เพิ่มรายการออกกำลังกาย (เช่น เวทก้น, วิ่ง 30 นาที)..." required
                        class="flex-1 px-3 py-2 rounded-xl bg-cream border border-borderlace text-sm focus:outline-none">
                    <button type="submit" class="px-4 py-2 rounded-xl bg-mint text-white font-semibold text-sm hover:bg-mint-dark transition">
                        +
                    </button>
                </form>

                <!-- Workout List -->
                <div id="workout-list" class="space-y-2">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 3. WEIGHT & BODY TRACKER                   -->
        <!-- ========================================== -->
        <section class="kawaii-card">
            <div class="kawaii-bar bg-periwinkle-light/85">
                <span class="font-semibold text-periwinkle-dark">🦋 weight_and_body.log</span>
                <div class="kawaii-dots"><span></span><span></span><span></span></div>
            </div>

            <div class="p-5 space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="font-whimsy italic font-bold text-xl text-plum">Weight & Body</h2>
                    <div class="flex gap-2 text-xs font-semibold">
                        <span id="badge-weight" class="px-2.5 py-1 rounded-xl bg-periwinkle-light text-periwinkle-dark">-- kg</span>
                        <span id="badge-fat" class="px-2.5 py-1 rounded-xl bg-blush-light text-blush-dark">Fat --%</span>
                        <span id="badge-muscle" class="px-2.5 py-1 rounded-xl bg-mint-light text-mint-dark">Muscle --kg</span>
                    </div>
                </div>

                <!-- Record Weight Form -->
                <form onsubmit="addBodyLog(event)" class="grid grid-cols-3 gap-2 bg-cream/80 p-3 rounded-2xl border border-borderlace">
                    <div>
                        <label class="block text-[11px] text-lilac mb-1">น้ำหนัก (kg)</label>
                        <input type="number" step="0.1" id="in-weight" placeholder="54.5" required class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-borderlace text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-lilac mb-1">% ไขมัน (ถ้ามี)</label>
                        <input type="number" step="0.1" id="in-fat" placeholder="24.0" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-borderlace text-sm focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-lilac mb-1">กล้ามเนื้อ kg (ถ้ามี)</label>
                        <input type="number" step="0.1" id="in-muscle" placeholder="38.2" class="w-full px-2.5 py-1.5 rounded-xl bg-white border border-borderlace text-sm focus:outline-none">
                    </div>
                    <button type="submit" class="col-span-3 mt-1 py-2 rounded-xl bg-gradient-to-r from-periwinkle to-lavender text-white font-semibold text-sm hover:opacity-95 transition">
                        บันทึกน้ำหนักวันนี้
                    </button>
                </form>

                <!-- Simple Chart -->
                <div class="h-52 w-full">
                    <canvas id="bodyChart"></canvas>
                </div>
            </div>
        </section>

    </div>

    <!-- Settings & Goals Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-plum/30 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl border-2 border-borderlace max-w-sm w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="font-whimsy italic font-bold text-xl text-plum">⚙️ ตั้งเป้าหมาย & AI Key</h3>
                <button onclick="closeModal('settings-modal')" class="p-1 text-lilac hover:text-plum"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>

            <form onsubmit="saveSettings(event)" class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-lilac mb-1">เป้าแคลอรี่ / วัน</label>
                        <input type="number" id="set-cal" required class="w-full px-3 py-2 rounded-xl bg-cream border border-borderlace">
                    </div>
                    <div>
                        <label class="block text-xs text-lilac mb-1">เป้าโปรตีน (g) / วัน</label>
                        <input type="number" id="set-pro" required class="w-full px-3 py-2 rounded-xl bg-cream border border-borderlace">
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-lilac mb-1">Gemini API Key (สำหรับปุ่ม ✨ AI คิดให้)</label>
                    <input type="password" id="set-apikey" placeholder="วาง AIzaSy... ที่นี่" class="w-full px-3 py-2 rounded-xl bg-cream border border-borderlace text-xs">
                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-plum text-white font-semibold hover:opacity-90 transition">
                    บันทึกการตั้งค่า
                </button>
            </form>

            <div class="pt-3 border-t border-borderlace flex gap-2">
                <button onclick="exportData()" class="flex-1 py-2 rounded-xl bg-lavender-light text-plum text-xs font-semibold">Export ข้อมูล</button>
                <label class="flex-1 py-2 rounded-xl bg-mint-light text-mint-dark text-xs font-semibold text-center cursor-pointer">
                    Import ข้อมูล
                    <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'cozy_simple_wellness_v1';

        function getTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        const TODAY_STR = getTodayStr();

        function getDefaultData() {
            return {
                goals: { calories: 1800, protein: 110 },
                foods: [
                    { id: 1, date: TODAY_STR, name: 'อกไก่นุ่ม + ไข่ต้ม 2 ฟอง', cal: 350, pro: 38 },
                    { id: 2, date: TODAY_STR, name: 'มัทฉะลาเต้หวานน้อย 🍵', cal: 130, pro: 4 }
                ],
                workouts: [
                    { id: 101, day: 'Mon', title: 'เวทก้น & ขา (Glutes & Legs)', done: true },
                    { id: 102, day: 'Wed', title: 'วิ่ง Zone 2 30 นาที', done: false },
                    { id: 103, day: 'Fri', title: 'เวทหลัง & ไหล่ (Back & Shoulders)', done: false }
                ],
                bodyLogs: [
                    { date: '2026-10-25', weight: 55.6, fat: 24.8, muscle: 38.0 },
                    { date: '2026-11-03', weight: 55.1, fat: 24.2, muscle: 38.3 },
                    { date: TODAY_STR, weight: 54.7, fat: 23.8, muscle: 38.6 }
                ]
            };
        }

        let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || getDefaultData();
        function save() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function showToast(msg) {
            const box = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'bg-plum text-white px-4 py-2.5 rounded-2xl shadow-md text-xs sm:text-sm font-medium transition-opacity duration-300';
            el.textContent = msg;
            box.appendChild(el);
            setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, 2500);
        }

        // --- 1. NUTRITION ---
        function renderNutrition() {
            const todayFoods = state.foods.filter(f => f.date === TODAY_STR);
            const totalCal = todayFoods.reduce((s, f) => s + Number(f.cal), 0);
            const totalPro = todayFoods.reduce((s, f) => s + Number(f.pro), 0);

            document.getElementById('cal-cur').textContent = totalCal;
            document.getElementById('cal-goal').textContent = state.goals.calories;
            document.getElementById('cal-bar').style.width = `${Math.min(100, (totalCal / state.goals.calories) * 100)}%`;

            document.getElementById('pro-cur').textContent = totalPro;
            document.getElementById('pro-goal').textContent = state.goals.protein;
            document.getElementById('pro-bar').style.width = `${Math.min(100, (totalPro / state.goals.protein) * 100)}%`;

            const listEl = document.getElementById('food-list');
            if (todayFoods.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-lilac py-3">ยังไม่ได้บันทึกอาหารวันนี้เลย 🍓</p>`;
                return;
            }

            listEl.innerHTML = todayFoods.map(f => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-white border border-borderlace">
                    <div>
                        <p class="text-sm font-semibold text-plum">${f.name}</p>
                        <p class="text-xs text-lilac">${f.cal} kcal • โปรตีน ${f.pro}g</p>
                    </div>
                    <button onclick="deleteFood(${f.id})" class="p-1.5 text-lilac hover:text-blush-dark">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addFood(e) {
            e.preventDefault();
            const name = document.getElementById('food-name').value.trim();
            const cal = parseInt(document.getElementById('food-cal').value) || 0;
            const pro = parseInt(document.getElementById('food-pro').value) || 0;

            state.foods.unshift({ id: Date.now(), date: TODAY_STR, name, cal, pro });
            document.getElementById('food-name').value = '';
            document.getElementById('food-cal').value = '';
            document.getElementById('food-pro').value = '';
            save();
            renderNutrition();
            showToast(`เพิ่ม "${name}" แล้ว 🍓`);
        }

        function deleteFood(id) {
            state.foods = state.foods.filter(f => f.id !== id);
            save();
            renderNutrition();
        }

        async function estimateAI() {
            const nameInput = document.getElementById('food-name');
            const foodText = nameInput.value.trim();
            if (!foodText) {
                showToast('พิมพ์ชื่ออาหารก่อนน้า 🍓');
                return;
            }

            const btn = document.getElementById('ai-btn');
            const oldText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '✨ กำลังคิด...';

            const apiKey = localStorage.getItem('garden_gemini_api_key') || "";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `Estimate calories (kcal) and protein (grams) for: "${foodText}". Return JSON with integer fields "calories" and "protein".` }] }],
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: { calories: { type: "INTEGER" }, protein: { type: "INTEGER" } },
                                required: ["calories", "protein"]
                            }
                        }
                    })
                });
                const data = await res.json();
                const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
                document.getElementById('food-cal').value = parsed.calories || 0;
                document.getElementById('food-pro').value = parsed.protein || 0;
                showToast(`✨ ประมาณ ${parsed.calories} kcal / โปรตีน ${parsed.protein}g`);
            } catch (err) {
                showToast('ยังไม่ได้ใส่ API Key ในตั้งค่า หรือ AI ไม่ตอบสนอง ลองกรอกเลขเองได้เลยน้า');
            } finally {
                btn.disabled = false;
                btn.innerHTML = oldText;
            }
        }

        // --- 2. WORKOUT CHECKLIST ---
        function renderWorkouts() {
            const doneCount = state.workouts.filter(w => w.done).length;
            document.getElementById('workout-progress').textContent = `${doneCount}/${state.workouts.length}`;

            const listEl = document.getElementById('workout-list');
            if (state.workouts.length === 0) {
                listEl.innerHTML = `<p class="text-center text-xs text-lilac py-3">ยังไม่มีตารางออกกำลังกาย เพิ่มด้านบนได้เลย 🩰</p>`;
                return;
            }

            listEl.innerHTML = state.workouts.map(w => `
                <div class="flex items-center justify-between p-3 rounded-xl border ${w.done ? 'bg-mint-light/40 border-mint/40' : 'bg-white border-borderlace'}">
                    <div class="flex items-center gap-2.5 flex-1 cursor-pointer" onclick="toggleWorkout(${w.id})">
                        <div class="w-5 h-5 rounded-lg border-2 flex items-center justify-center ${w.done ? 'bg-mint border-mint text-white' : 'border-mint/60'}">
                            ${w.done ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-md bg-periwinkle-light text-periwinkle-dark font-bold">${w.day}</span>
                        <span class="text-sm font-medium ${w.done ? 'line-through text-lilac' : 'text-plum'}">${w.title}</span>
                    </div>
                    <button onclick="deleteWorkout(${w.id})" class="p-1 text-lilac hover:text-blush-dark">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function addWorkout(e) {
            e.preventDefault();
            const day = document.getElementById('wo-day').value;
            const title = document.getElementById('wo-title').value.trim();
            state.workouts.push({ id: Date.now(), day, title, done: false });
            document.getElementById('wo-title').value = '';
            save();
            renderWorkouts();
        }

        function toggleWorkout(id) {
            const item = state.workouts.find(w => w.id === id);
            if (item) {
                item.done = !item.done;
                save();
                renderWorkouts();
                if (item.done) showToast('เก่งมาก! ออกกำลังกายเสร็จไปอีก 1 🎉');
            }
        }

        function deleteWorkout(id) {
            state.workouts = state.workouts.filter(w => w.id !== id);
            save();
            renderWorkouts();
        }

        function resetWorkouts() {
            state.workouts.forEach(w => w.done = false);
            save();
            renderWorkouts();
            showToast('รีเซ็ตตารางสำหรับวีคใหม่แล้ว ✨');
        }

        // --- 3. WEIGHT & BODY ---
        let chartInstance = null;

        function renderBody() {
            const logs = state.bodyLogs;
            if (logs.length > 0) {
                const last = logs[logs.length - 1];
                document.getElementById('badge-weight').textContent = `${last.weight} kg`;
                document.getElementById('badge-fat').textContent = last.fat ? `Fat ${last.fat}%` : 'Fat --%';
                document.getElementById('badge-muscle').textContent = last.muscle ? `Muscle ${last.muscle}kg` : 'Muscle --kg';
            }

            const ctx = document.getElementById('bodyChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: logs.map(l => l.date.slice(5)),
                    datasets: [
                        {
                            label: 'Weight (kg)',
                            data: logs.map(l => l.weight),
                            borderColor: '#99B8EB',
                            backgroundColor: 'rgba(153, 184, 235, 0.2)',
                            borderWidth: 2.5,
                            tension: 0.35
                        },
                        {
                            label: 'Muscle (kg)',
                            data: logs.map(l => l.muscle || null),
                            borderColor: '#8CD1BE',
                            borderWidth: 2.5,
                            tension: 0.35,
                            spanGaps: true
                        },
                        {
                            label: 'Body Fat (%)',
                            data: logs.map(l => l.fat || null),
                            borderColor: '#F2A7C3',
                            borderDash: [4, 4],
                            borderWidth: 2,
                            tension: 0.35,
                            spanGaps: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { font: { family: 'Patrick Hand', size: 12 } } } },
                    scales: { x: { grid: { display: false } }, y: { grid: { color: '#F3ECFA' } } }
                }
            });
        }

        function addBodyLog(e) {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('in-weight').value);
            const fat = parseFloat(document.getElementById('in-fat').value) || null;
            const muscle = parseFloat(document.getElementById('in-muscle').value) || null;

            const idx = state.bodyLogs.findIndex(l => l.date === TODAY_STR);
            if (idx > -1) {
                state.bodyLogs[idx] = { date: TODAY_STR, weight, fat, muscle };
            } else {
                state.bodyLogs.push({ date: TODAY_STR, weight, fat, muscle });
            }

            document.getElementById('in-weight').value = '';
            document.getElementById('in-fat').value = '';
            document.getElementById('in-muscle').value = '';
            save();
            renderBody();
            showToast('บันทึกน้ำหนักวันนี้เรียบร้อย 🦋');
        }

        // --- SETTINGS & MODALS ---
        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            document.getElementById(id).classList.add('flex');
            document.getElementById('set-cal').value = state.goals.calories;
            document.getElementById('set-pro').value = state.goals.protein;
            document.getElementById('set-apikey').value = localStorage.getItem('garden_gemini_api_key') || '';
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function saveSettings(e) {
            e.preventDefault();
            state.goals.calories = parseInt(document.getElementById('set-cal').value) || 1800;
            state.goals.protein = parseInt(document.getElementById('set-pro').value) || 110;
            const key = document.getElementById('set-apikey').value.trim();
            localStorage.setItem('garden_gemini_api_key', key);
            save();
            renderNutrition();
            closeModal('settings-modal');
            showToast('บันทึกการตั้งค่าแล้ว ✨');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wellness-backup-${TODAY_STR}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                try {
                    state = JSON.parse(ev.target.result);
                    save();
                    renderAll();
                    closeModal('settings-modal');
                    showToast('นำเข้าข้อมูลสำเร็จ ✨');
                } catch {
                    showToast('ไฟล์ไม่ถูกต้อง');
                }
            };
            reader.readAsText(file);
        }

        function renderAll() {
            document.getElementById('header-date').textContent = new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
            renderNutrition();
            renderWorkouts();
            renderBody();
            lucide.createIcons();
        }

        window.addEventListener('DOMContentLoaded', renderAll);
    </script>
</body>
</html>
